<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Secure Session Auth Test</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="content">
            <h1>Login</h1>

            <form>
                <div class="field">
                    <label for="name">Username</label>
                    <input type="text" name="username" autofocus autocomplete="off" />
                </div>
                <div class="field">
                    <label for="name">Password</label>
                    <input type="password" name="Password" autofocus autocomplete="off" />
                </div>
            </form>
        </main>
    </body>
</html>
